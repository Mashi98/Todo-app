
name: CI

# When the pipeline runs: on every push to main, and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Run the same steps on two Node versions
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No install step: this project has no dependencies.
      # Once you add some, commit package-lock.json and add:  - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
